[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "cython>=3.0",
  "numpy>=1.26,<3.0",
  "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[project]
name = "tick-backtest"
version = "0.1.0"
description = "Local backtesting toolkit with Cython-accelerated primitives."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [{ name = "Edward Clewer" }]
maintainers = [{ name = "Edward Clewer" }]
license = "Apache-2.0"
keywords = ["backtesting", "foreign-exchange", "quantitative-finance", "trading", "cython"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Cython",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=1.5,<2.3",
  "pyarrow>=10.0,<16.0",
  "matplotlib>=3.7,<3.9",
  "pyyaml>=6.0,<6.1",
]

[project.urls]
Homepage = "https://github.com/edwardclewer/tick_backtest"
Documentation = "https://edwardclewer.github.io/tick_backtest/"
Source = "https://github.com/edwardclewer/tick_backtest"
Issues = "https://github.com/edwardclewer/tick_backtest/issues"
Changelog = "https://github.com/edwardclewer/tick_backtest/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tests = ["pytest>=8.0,<9.0"]

[project.scripts]
tick-backtest = "tick_backtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tick_backtest*"]
exclude = ["tick_backtest.__pycache__*"]

[tool.setuptools.package-data]
"tick_backtest" = [
  "config/templates/**/*.yaml",
  "demo_data/**/*.parquet",
  "py.typed"
]

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
skip = "*-musllinux*"
test-requires = ["pytest>=8.0,<9.0"]
test-command = "bash {project}/scripts/installed_cli_smoke.sh"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
