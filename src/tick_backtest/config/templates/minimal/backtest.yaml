# Minimal starter backtest config for tick-backtest.
# Copy the companion metrics.yaml and strategy.yaml into the same directory.

schema_version: "1.0"
pairs: [EURUSD]
start: 2024-01
end: 2024-01
pip_size: 0.0001
warmup_seconds: 1800
validate_ticks: true
trade_output_mode: trades
data_base_path: "/abs/path/to/tick_data/"
output_base_path: "/abs/path/to/backtest_outputs/"
metrics_config_path: "./metrics.yaml"
strategy_config_path: "./strategy.yaml"
